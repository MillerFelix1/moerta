# Nginx配置文件 - 数据解构专家测试平台
# 复制到 /etc/nginx/sites-available/shangyu.icu

server {
    listen 80;
    server_name shangyu.icu www.shangyu.icu;
    
    # 如果已配置SSL，取消以下注释重定向到HTTPS
    # return 301 https://$server_name$request_uri;
    
    # 访问日志
    access_log /var/log/nginx/shangyu_access.log;
    error_log /var/log/nginx/shangyu_error.log;
    
    # 客户端最大上传大小
    client_max_body_size 10M;
    
    # 前端静态文件
    location / {
        root /var/www/shangyu.icu/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 缓存静态资源
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API后端代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 流式响应配置（重要！）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # SSE支持
        chunked_transfer_encoding off;
    }
    
    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8000/;
        access_log off;
    }
}

# HTTPS配置（使用certbot后会自动生成）
server {
    listen 443 ssl http2;
    server_name shangyu.icu www.shangyu.icu;
    
    # SSL证书（certbot自动配置）
    # ssl_certificate /etc/letsencrypt/live/shangyu.icu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shangyu.icu/privkey.pem;
    
    # SSL优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 其他配置与HTTP相同
    access_log /var/log/nginx/shangyu_ssl_access.log;
    error_log /var/log/nginx/shangyu_ssl_error.log;
    
    client_max_body_size 10M;
    
    location / {
        root /var/www/shangyu.icu/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        chunked_transfer_encoding off;
    }
    
    location /health {
        proxy_pass http://127.0.0.1:8000/;
        access_log off;
    }
}

