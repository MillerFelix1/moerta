<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Reconstruction</title>
    <meta name="theme-color" content="#6366f1">
    
    <!-- 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--background);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* 液态玻璃效果 */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 0.5rem;
        }

        .sidebar-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 1rem;
            background: var(--glass);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .sessions {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-right: 0.25rem;
        }

        .session-item {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .session-item:hover {
            background: var(--glass);
            border-color: var(--glass-border);
        }

        .session-item.active {
            background: var(--glass);
            border-color: var(--glass-border);
        }

        .session-title {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 1rem;
        }

        /* 消息容器 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
        }

        /* 空状态 - 输入框居中 */
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 消息 */
        .message {
            margin-bottom: 1.5rem;
            animation: message-in 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes message-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            max-width: 800px;
            padding: 1rem 1.25rem;
            border-radius: 1.25rem;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            margin-left: auto;
        }

        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 输入区域 */
        .input-area {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .input-wrapper {
            border-radius: 1.5rem;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }

        .input-field {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 1rem;
            resize: none;
            outline: none;
            max-height: 200px;
            min-height: 24px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--glass);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            border: 1px solid var(--glass-border);
        }

        .send-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 加载动画 */
        .loading {
            display: inline-flex;
            gap: 0.25rem;
        }

        .loading span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text);
            animation: loading 1.4s infinite both;
        }

        .loading span:nth-child(1) { animation-delay: 0s; }
        .loading span:nth-child(2) { animation-delay: 0.2s; }
        .loading span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loading {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* 代码块样式 */
        pre {
            background: rgba(0, 0, 0, 0.3) !important;
            border-radius: 0.75rem;
            padding: 1rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        code {
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.9em;
        }

        :not(pre) > code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.9em;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 1000;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                padding: 0.5rem;
            }

            .messages-container {
                padding: 0.5rem 0;
            }

            .message-content {
                max-width: 100%;
                font-size: 0.95rem;
            }

            .input-area {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <div class="sidebar" :class="{ open: sidebarOpen }">
            <div class="sidebar-header glass">
                <div class="sidebar-title">Memory Reconstruction</div>
                <button class="new-chat-btn" @click="newChat">+ 新对话</button>
            </div>
            
            <div class="sessions">
                <div v-for="session in sessions" 
                     :key="session.id"
                     class="session-item"
                     :class="{ active: session.id === currentSessionId }"
                     @click="loadSession(session.id)">
                    <div class="session-title">{{ session.title }}</div>
                    <div class="session-time">{{ formatTime(session.created_at) }}</div>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content" @click="sidebarOpen = false">
            <!-- 消息列表 -->
            <div class="messages-container" ref="messagesContainer" :class="{ 'empty-state': messages.length === 0 }">
                <div v-for="(msg, index) in messages" :key="index" class="message" :class="msg.role">
                    <div class="message-content" v-html="renderMarkdown(msg.content)"></div>
                </div>
                
                <div v-if="isLoading" class="message assistant">
                    <div class="message-content">
                        <div class="loading">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper glass">
                    <textarea 
                        v-model="inputText"
                        ref="inputField"
                        class="input-field"
                        rows="1"
                        @keydown.enter.exact.prevent="sendMessage"
                        @input="autoResize"
                    ></textarea>
                    <button class="send-btn" @click="sendMessage" :disabled="!inputText.trim() || isLoading">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    sessions: [],
                    currentSessionId: null,
                    messages: [],
                    inputText: '',
                    isLoading: false,
                    sidebarOpen: false,
                    apiBaseUrl: window.location.hostname === 'localhost' ? 'http://localhost:8000' : ''
                };
            },

            mounted() {
                this.loadSessions();
                this.setupMobileGestures();
            },

            methods: {
                // 自动调整输入框高度
                autoResize() {
                    const field = this.$refs.inputField;
                    if (!field) return;
                    field.style.height = 'auto';
                    field.style.height = Math.min(field.scrollHeight, 200) + 'px';
                },

                // 移动端手势
                setupMobileGestures() {
                    if (window.innerWidth > 768) return;
                    
                    let touchStartX = 0;
                    const container = document.querySelector('.main-content');
                    
                    container.addEventListener('touchstart', (e) => {
                        touchStartX = e.touches[0].clientX;
                    });
                    
                    container.addEventListener('touchend', (e) => {
                        const touchEndX = e.changedTouches[0].clientX;
                        const diff = touchEndX - touchStartX;
                        
                        // 向右滑动打开侧边栏
                        if (diff > 100 && touchStartX < 50) {
                            this.sidebarOpen = true;
                        }
                        // 向左滑动关闭侧边栏
                        else if (diff < -100) {
                            this.sidebarOpen = false;
                        }
                    });
                },

                // 渲染Markdown
                renderMarkdown(content) {
                    if (!content) return '';
                    const html = marked.parse(content);
                    this.$nextTick(() => {
                        document.querySelectorAll('pre code').forEach((block) => {
                            hljs.highlightElement(block);
                        });
                    });
                    return html;
                },

                // 格式化时间
                formatTime(dateString) {
                    if (!dateString) return '';
                    const date = new Date(dateString);
                    const now = new Date();
                    const diff = now - date;
                    const minutes = Math.floor(diff / 60000);
                    const hours = Math.floor(diff / 3600000);
                    const days = Math.floor(diff / 86400000);

                    if (minutes < 1) return '刚刚';
                    if (minutes < 60) return `${minutes}分钟前`;
                    if (hours < 24) return `${hours}小时前`;
                    if (days < 7) return `${days}天前`;
                    return date.toLocaleDateString('zh-CN');
                },

                // 滚动到底部
                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$refs.messagesContainer;
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    });
                },

                // 加载会话列表
                async loadSessions() {
                    try {
                        const response = await axios.get(`${this.apiBaseUrl}/api/sessions`);
                        this.sessions = response.data || [];
                        
                        if (this.sessions.length > 0 && !this.currentSessionId) {
                            await this.loadSession(this.sessions[0].id);
                        }
                    } catch (error) {
                        console.error('加载会话列表失败:', error);
                    }
                },

                // 加载指定会话
                async loadSession(sessionId) {
                    try {
                        const response = await axios.get(`${this.apiBaseUrl}/api/sessions/${sessionId}`);
                        this.currentSessionId = sessionId;
                        this.messages = response.data.messages || [];
                        this.sidebarOpen = false;
                        this.scrollToBottom();
                    } catch (error) {
                        console.error('加载会话失败:', error);
                    }
                },

                // 新建对话
                async newChat() {
                    this.currentSessionId = null;
                    this.messages = [];
                    this.sidebarOpen = false;
                },

                // 发送消息
                async sendMessage() {
                    const userMessage = this.inputText.trim();
                    if (!userMessage || this.isLoading) return;

                    // 移动端：发送消息时全屏
                    if (window.innerWidth <= 768 && document.documentElement.requestFullscreen) {
                        try {
                            await document.documentElement.requestFullscreen();
                        } catch (e) {
                            console.log('全屏请求被拒绝或不支持');
                        }
                    }

                    this.inputText = '';
                    this.$refs.inputField.style.height = 'auto';
                    
                    this.messages.push({
                        role: 'user',
                        content: userMessage
                    });

                    this.isLoading = true;
                    this.scrollToBottom();

                    try {
                        const response = await fetch(`${this.apiBaseUrl}/api/chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: userMessage,
                                session_id: this.currentSessionId,
                                stream: true
                            })
                        });

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        
                        const assistantMessage = { role: 'assistant', content: '' };
                        this.messages.push(assistantMessage);
                        this.isLoading = false;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const parsed = JSON.parse(data);
                                        
                                        if (parsed.session_id && !this.currentSessionId) {
                                            this.currentSessionId = parsed.session_id;
                                        }

                                        if (parsed.content) {
                                            assistantMessage.content += parsed.content;
                                            this.scrollToBottom();
                                        }
                                    } catch (e) {
                                        console.error('解析失败:', e);
                                    }
                                }
                            }
                        }

                        await this.loadSessions();
                    } catch (error) {
                        console.error('发送失败:', error);
                        this.isLoading = false;
                        this.messages.push({
                            role: 'assistant',
                            content: '抱歉，发送失败，请稍后重试。'
                        });
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
