<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memory Reconstruction</title>
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --bg: #ffffff;
            --surface: #f8f9fa;
            --text: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        #app {
            display: flex;
            height: 100vh;
            height: 100dvh; /* 移动端视口 */
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 75%;
            max-width: 300px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            height: 100dvh;
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), rgba(139, 92, 246, 0.05));
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .new-chat-btn {
            margin: 16px;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .new-chat-btn:active {
            transform: scale(0.98);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            -webkit-overflow-scrolling: touch;
        }

        .session-item {
            padding: 14px;
            margin-bottom: 8px;
            background: var(--surface);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .session-item:active {
            transform: scale(0.98);
        }

        .session-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border-color: var(--primary);
        }

        .session-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text);
        }

        .session-time {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ===== 主内容区 ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        /* 空状态 - 输入框居中 */
        .messages-container.empty {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-content {
            max-width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: var(--primary);
            color: white;
            margin-left: auto;
            max-width: 85%;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--surface);
            border: 1px solid var(--border);
            max-width: 90%;
            border-bottom-left-radius: 4px;
        }

        /* ===== 输入区域 ===== */
        .input-area {
            padding: 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--bg);
            border-top: 1px solid var(--border);
            width: 100%;
        }

        .input-area.centered {
            border-top: none;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px; /* 防止iOS缩放 */
            resize: none;
            outline: none;
            max-height: 120px;
            font-family: inherit;
            line-height: 1.5;
            padding: 4px 0;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.9);
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* 加载动画 */
        .loading {
            display: inline-flex;
            gap: 4px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { 
                opacity: 0.3; 
                transform: scale(0.8); 
            }
            40% { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        /* 代码块 */
        pre {
            background: #f6f8fa !important;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border);
        }

        code {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 14px;
        }

        :not(pre) > code {
            background: rgba(99, 102, 241, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--primary);
        }

        /* 滚动条（仅桌面端显示） */
        @media (min-width: 769px) {
            ::-webkit-scrollbar {
                width: 6px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 3px;
            }
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            ::-webkit-scrollbar {
                display: none;
            }
        }

        /* 滑动提示 */
        .swipe-hint {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px 14px 10px 6px;
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            color: white;
            font-size: 13px;
            border-radius: 0 14px 14px 0;
            z-index: 999;
            pointer-events: none;
            animation: pulse 2s infinite;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
            transition: opacity 0.5s, transform 0.5s;
        }

        .swipe-hint::before {
            content: '👉';
            margin-right: 6px;
        }

        .swipe-hint.hide {
            opacity: 0;
            transform: translateY(-50%) translateX(-100%);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* 遮罩 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 遮罩 -->
        <div class="overlay" :class="{ active: sidebarOpen }" @click="sidebarOpen = false"></div>

        <!-- 侧边栏 -->
        <div class="sidebar" :class="{ open: sidebarOpen }">
            <div class="sidebar-header">
                <div class="sidebar-title">🧠 Memory</div>
            </div>
            
            <button class="new-chat-btn" @click="newChat">+ 新对话</button>
            
            <div class="sessions-list">
                <div 
                    v-for="session in sessions" 
                    :key="session.id"
                    class="session-item"
                    :class="{ active: session.id === currentSessionId }"
                    @click="loadSession(session.id)">
                    <div class="session-title">{{ session.title }}</div>
                    <div class="session-time">{{ formatTime(session.created_at) }}</div>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 滑动提示 -->
            <div class="swipe-hint" v-if="showSwipeHint" :class="{ hide: !showSwipeHint }">
                右滑打开
            </div>

            <!-- 消息列表 -->
            <div class="messages-container" :class="{ empty: messages.length === 0 }" ref="messagesContainer">
                <div v-for="(msg, index) in messages" :key="index" class="message" :class="msg.role">
                    <div class="message-content" v-html="renderMarkdown(msg.content)"></div>
                </div>
                
                <div v-if="isLoading" class="message assistant">
                    <div class="message-content">
                        <div class="loading">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area" :class="{ centered: messages.length === 0 }">
                <div class="input-wrapper">
                    <textarea 
                        v-model="inputText"
                        ref="inputField"
                        class="input-field"
                        rows="1"
                        @keydown.enter.exact.prevent="sendMessage"
                        @input="autoResize"
                    ></textarea>
                    <button class="send-btn" @click="sendMessage" :disabled="!inputText.trim() || isLoading">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    sessions: [],
                    currentSessionId: null,
                    messages: [],
                    inputText: '',
                    isLoading: false,
                    sidebarOpen: false,
                    showSwipeHint: true,
                    hasFullscreened: false,
                    apiBaseUrl: window.location.hostname === 'localhost' ? 'http://localhost:8000' : ''
                };
            },

            mounted() {
                this.loadSessions();
                this.setupMobileGestures();
                
                // 5秒后隐藏提示
                setTimeout(() => this.showSwipeHint = false, 5000);
            },

            methods: {
                // 自动调整输入框高度
                autoResize() {
                    const field = this.$refs.inputField;
                    if (!field) return;
                    field.style.height = 'auto';
                    field.style.height = Math.min(field.scrollHeight, 120) + 'px';
                },

                // 移动端手势
                setupMobileGestures() {
                    let touchStartX = 0;
                    let touchStartY = 0;
                    const container = document.querySelector('.main-content');
                    
                    container.addEventListener('touchstart', (e) => {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                        this.showSwipeHint = false;
                    }, { passive: true });
                    
                    container.addEventListener('touchend', (e) => {
                        const touchEndX = e.changedTouches[0].clientX;
                        const touchEndY = e.changedTouches[0].clientY;
                        const deltaX = touchEndX - touchStartX;
                        const deltaY = Math.abs(touchEndY - touchStartY);
                        
                        // 横向滑动大于纵向滑动
                        if (Math.abs(deltaX) > deltaY && Math.abs(deltaX) > 80) {
                            if (deltaX > 0 && touchStartX < 50) {
                                // 从左边缘向右滑
                                this.sidebarOpen = true;
                            } else if (deltaX < 0 && this.sidebarOpen) {
                                // 向左滑
                                this.sidebarOpen = false;
                            }
                        }
                    }, { passive: true });
                },

                renderMarkdown(content) {
                    if (!content) return '';
                    const html = marked.parse(content);
                    this.$nextTick(() => {
                        document.querySelectorAll('pre code').forEach((block) => {
                            hljs.highlightElement(block);
                        });
                    });
                    return html;
                },

                formatTime(dateString) {
                    if (!dateString) return '';
                    const date = new Date(dateString);
                    const now = new Date();
                    const diff = now - date;
                    const minutes = Math.floor(diff / 60000);
                    const hours = Math.floor(diff / 3600000);
                    const days = Math.floor(diff / 86400000);

                    if (minutes < 1) return '刚刚';
                    if (minutes < 60) return `${minutes}分钟前`;
                    if (hours < 24) return `${hours}小时前`;
                    if (days < 7) return `${days}天前`;
                    return date.toLocaleDateString('zh-CN');
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$refs.messagesContainer;
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    });
                },

                async loadSessions() {
                    try {
                        const response = await axios.get(`${this.apiBaseUrl}/api/sessions`);
                        this.sessions = response.data || [];
                        
                        if (this.sessions.length > 0 && !this.currentSessionId) {
                            await this.loadSession(this.sessions[0].id);
                        }
                    } catch (error) {
                        console.error('加载会话列表失败:', error);
                    }
                },

                async loadSession(sessionId) {
                    try {
                        const response = await axios.get(`${this.apiBaseUrl}/api/sessions/${sessionId}`);
                        this.currentSessionId = sessionId;
                        this.messages = response.data.messages || [];
                        this.sidebarOpen = false;
                        this.scrollToBottom();
                    } catch (error) {
                        console.error('加载会话失败:', error);
                    }
                },

                newChat() {
                    this.currentSessionId = null;
                    this.messages = [];
                    this.sidebarOpen = false;
                    this.hasFullscreened = false;
                },

                async sendMessage() {
                    const userMessage = this.inputText.trim();
                    if (!userMessage || this.isLoading) return;

                    // 📱 移动端：发送消息时全屏
                    if (!this.hasFullscreened) {
                        this.hasFullscreened = true;
                        try {
                            const elem = document.documentElement;
                            if (elem.requestFullscreen) {
                                await elem.requestFullscreen();
                            } else if (elem.webkitRequestFullscreen) {
                                await elem.webkitRequestFullscreen();
                            } else if (elem.mozRequestFullScreen) {
                                await elem.mozRequestFullScreen();
                            } else if (elem.msRequestFullscreen) {
                                await elem.msRequestFullscreen();
                            }
                            console.log('✅ 已全屏');
                        } catch (e) {
                            console.log('全屏请求:', e.message);
                        }
                    }

                    this.inputText = '';
                    this.$refs.inputField.style.height = 'auto';
                    
                    this.messages.push({
                        role: 'user',
                        content: userMessage
                    });

                    this.isLoading = true;
                    this.scrollToBottom();

                    try {
                        const response = await fetch(`${this.apiBaseUrl}/api/chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: userMessage,
                                session_id: this.currentSessionId,
                                stream: true
                            })
                        });

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        
                        const assistantMessage = { role: 'assistant', content: '' };
                        this.messages.push(assistantMessage);
                        this.isLoading = false;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const parsed = JSON.parse(data);
                                        
                                        if (parsed.session_id && !this.currentSessionId) {
                                            this.currentSessionId = parsed.session_id;
                                        }

                                        if (parsed.content) {
                                            assistantMessage.content += parsed.content;
                                            this.scrollToBottom();
                                        }
                                    } catch (e) {
                                        console.error('解析失败:', e);
                                    }
                                }
                            }
                        }

                        await this.loadSessions();
                    } catch (error) {
                        console.error('发送失败:', error);
                        this.isLoading = false;
                        this.messages.push({
                            role: 'assistant',
                            content: '抱歉，发送失败，请稍后重试。'
                        });
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
