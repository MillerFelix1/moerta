<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Reconstruction</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --background: #ffffff;
            --surface: #f8f9fa;
            --surface-light: #e9ecef;
            --text: #1a1a1a;
            --text-secondary: #6c757d;
            --border: #dee2e6;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-hover: rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            overflow: hidden;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--background);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            box-shadow: 2px 0 8px var(--shadow);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-header p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .new-chat-btn {
            margin: 16px;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            padding: 12px;
            margin-bottom: 4px;
            background: var(--surface);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px var(--shadow);
        }

        .session-item:hover {
            background: var(--surface-light);
            border-color: var(--primary);
            box-shadow: 0 2px 8px var(--shadow-hover);
        }

        .session-item.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        .session-item.active .session-title,
        .session-item.active .session-meta {
            color: white;
        }

        .session-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .session-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .session-actions button {
            padding: 4px 8px;
            font-size: 11px;
            background: white;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .session-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 16px 24px;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .chat-title {
            font-size: 16px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-actions label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .header-actions input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 消息区域 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-role {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .message.user .message-role {
            color: var(--primary);
        }

        .message.assistant .message-role {
            color: var(--secondary);
        }

        .message-content {
            background: var(--surface);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            line-height: 1.7;
            box-shadow: 0 1px 3px var(--shadow);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.08));
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.15);
        }

        .thoughts-section {
            margin-top: 12px;
            padding: 12px;
            background: #fff9e6;
            border-left: 3px solid var(--warning);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text);
            box-shadow: 0 1px 3px rgba(245, 158, 11, 0.1);
        }

        .thoughts-label {
            font-weight: 600;
            color: var(--warning);
            margin-bottom: 8px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* 输入区域 */
        .input-area {
            padding: 16px 24px;
            background: var(--background);
            border-top: 1px solid var(--border);
            box-shadow: 0 -2px 8px var(--shadow);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            padding: 14px 18px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: all 0.3s;
            max-height: 200px;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: var(--background);
        }

        .send-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--surface);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* 加载动画 */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* 错误提示 */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        /* 响应式 - 移动端优化 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 1000;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }
            
            .chat-header {
                padding: 12px 16px;
            }
            
            .chat-title {
                font-size: 14px;
            }
            
            .header-actions {
                font-size: 12px;
            }
            
            .messages-container {
                padding: 16px;
            }
            
            .message-content {
                font-size: 14px;
                padding: 12px;
            }
            
            .input-area {
                padding: 12px 16px;
            }
            
            .input-field {
                font-size: 16px; /* 防止iOS自动缩放 */
                padding: 12px 14px;
            }
            
            .send-btn {
                padding: 12px 20px;
                font-size: 13px;
            }
            
            /* 移动端侧边栏切换按钮 */
            .mobile-menu-btn {
                display: block;
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 56px;
                height: 56px;
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                color: white;
                border: none;
                border-radius: 50%;
                font-size: 24px;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
                z-index: 999;
                transition: all 0.3s;
            }
            
            .mobile-menu-btn:active {
                transform: scale(0.95);
            }
        }
        
        /* 桌面端隐藏移动菜单按钮 */
        .mobile-menu-btn {
            display: none;
        }
        
        /* 移动端遮罩 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        
        .sidebar-overlay.active {
            display: block;
        }
        
        /* 触摸优化 */
        @media (hover: none) {
            .session-item,
            .new-chat-btn,
            .send-btn {
                -webkit-tap-highlight-color: transparent;
            }
        }

        /* Markdown样式 */
        .message-content pre {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .message-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'Consolas', 'Monaco', monospace;
            color: #d63384;
        }

        .message-content pre code {
            background: none;
            padding: 0;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 移动端侧边栏遮罩 -->
        <div class="sidebar-overlay" :class="{ active: sidebarOpen }" @click="sidebarOpen = false"></div>
        
        <!-- 侧边栏 -->
        <div class="sidebar" :class="{ open: sidebarOpen }">
            <div class="sidebar-header">
                <h1>🧠 Memory Reconstruction</h1>
                <p>AI-Powered Memory Analysis Platform</p>
            </div>
            
            <button class="new-chat-btn" @click="newChat">
                ✨ 新建对话
            </button>
            
            <div class="sessions-list">
                <div 
                    v-for="session in sessions" 
                    :key="session.session_id"
                    class="session-item"
                    :class="{ active: currentSessionId === session.session_id }"
                    @click="loadSession(session.session_id)"
                >
                    <div class="session-title">{{ session.title }}</div>
                    <div class="session-meta">
                        <span>{{ session.message_count }} 条消息</span>
                        <span>{{ formatDate(session.updated_at) }}</span>
                    </div>
                    <div class="session-actions" v-if="currentSessionId === session.session_id">
                        <button @click.stop="deleteSession(session.session_id)">删除</button>
                    </div>
                </div>
                
                <div v-if="sessions.length === 0" style="padding: 20px; text-align: center; color: var(--text-secondary); font-size: 13px;">
                    暂无历史记录
                </div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="chat-header">
                <div class="chat-title">{{ currentTitle }}</div>
                <div class="header-actions">
                    <label>
                        <input type="checkbox" v-model="enableStream">
                        流式输出
                    </label>
                    <label>
                        <input type="checkbox" v-model="enableThoughts">
                        显示思考
                    </label>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="messages-container" ref="messagesContainer">
                <div v-if="errorMessage" class="error-message">
                    ❌ {{ errorMessage }}
                </div>

                <div v-if="messages.length === 0" class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <h2>开始新对话</h2>
                    <p>向数据解构专家提问，测试信息编码与解析能力</p>
                </div>

                <div 
                    v-for="(message, index) in messages" 
                    :key="index"
                    class="message"
                    :class="message.role"
                >
                    <div class="message-role">{{ message.role === 'user' ? '👤 用户' : '🤖 助手' }}</div>
                    <div class="message-content" v-html="formatMessage(message.content)"></div>
                    <div v-if="message.thoughts" class="thoughts-section">
                        <div class="thoughts-label">💭 思考过程</div>
                        <div v-html="formatMessage(message.thoughts)"></div>
                    </div>
                </div>

                <div v-if="isLoading" class="message assistant">
                    <div class="message-role">🤖 助手</div>
                    <div class="message-content">
                        <div class="loading-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        正在思考...
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        v-model="inputText"
                        @keydown.enter.exact.prevent="sendMessage"
                        class="input-field"
                        placeholder="输入要解析的数据或问题... (Enter 发送)"
                        rows="1"
                        :disabled="isLoading"
                    ></textarea>
                    <button 
                        class="send-btn" 
                        @click="sendMessage"
                        :disabled="isLoading || !inputText.trim()"
                    >
                        {{ isLoading ? '发送中...' : '发送' }}
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 移动端菜单按钮 -->
        <button class="mobile-menu-btn" @click="sidebarOpen = !sidebarOpen">
            {{ sidebarOpen ? '✕' : '☰' }}
        </button>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // API配置 - 自动检测环境
                    apiBaseUrl: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                        ? 'http://localhost:8000'
                        : window.location.protocol + '//' + window.location.hostname,
                    
                    // 界面状态
                    sessions: [],
                    currentSessionId: null,
                    messages: [],
                    inputText: '',
                    isLoading: false,
                    errorMessage: '',
                    sidebarOpen: false, // 移动端侧边栏状态
                    
                    // 功能开关
                    enableStream: true,
                    enableThoughts: false,
                    
                    // 当前会话标题
                    currentTitle: '新对话'
                };
            },
            
            mounted() {
                this.loadSessions();
                // 自动调整textarea高度
                this.$watch('inputText', () => {
                    this.$nextTick(() => {
                        const textarea = document.querySelector('.input-field');
                        textarea.style.height = 'auto';
                        textarea.style.height = textarea.scrollHeight + 'px';
                    });
                });
            },
            
            methods: {
                // 加载会话列表
                async loadSessions() {
                    try {
                        const response = await axios.get(`${this.apiBaseUrl}/api/sessions`);
                        this.sessions = response.data.sessions;
                    } catch (error) {
                        console.error('加载会话列表失败:', error);
                    }
                },
                
                // 加载会话详情
                async loadSession(sessionId) {
                    try {
                        const response = await axios.get(`${this.apiBaseUrl}/api/sessions/${sessionId}`);
                        this.currentSessionId = sessionId;
                        this.messages = response.data.messages;
                        
                        // 更新当前标题
                        const session = this.sessions.find(s => s.session_id === sessionId);
                        if (session) {
                            this.currentTitle = session.title;
                        }
                        
                        // 移动端自动关闭侧边栏
                        this.sidebarOpen = false;
                        
                        this.scrollToBottom();
                    } catch (error) {
                        console.error('加载会话详情失败:', error);
                        this.errorMessage = '加载会话失败';
                    }
                },
                
                // 新建对话
                newChat() {
                    this.currentSessionId = null;
                    this.messages = [];
                    this.currentTitle = '新对话';
                    this.errorMessage = '';
                    // 移动端自动关闭侧边栏
                    this.sidebarOpen = false;
                },
                
                // 发送消息
                async sendMessage() {
                    if (!this.inputText.trim() || this.isLoading) return;
                    
                    const userMessage = this.inputText.trim();
                    this.inputText = '';
                    this.errorMessage = '';
                    
                    // 添加用户消息
                    this.messages.push({
                        role: 'user',
                        content: userMessage
                    });
                    
                    this.isLoading = true;
                    this.scrollToBottom();
                    
                    try {
                        if (this.enableStream) {
                            await this.sendStreamMessage(userMessage);
                        } else {
                            await this.sendNormalMessage(userMessage);
                        }
                        
                        // 刷新会话列表
                        await this.loadSessions();
                    } catch (error) {
                        console.error('发送消息失败:', error);
                        this.errorMessage = error.message || '发送失败，请重试';
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                // 流式发送
                async sendStreamMessage(userMessage) {
                    const response = await fetch(`${this.apiBaseUrl}/api/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            prompt: userMessage,
                            session_id: this.currentSessionId,
                            stream: true,
                            incremental_output: true,
                            has_thoughts: this.enableThoughts
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error('请求失败');
                    }
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    
                    let assistantMessage = {
                        role: 'assistant',
                        content: '',
                        thoughts: ''
                    };
                    this.messages.push(assistantMessage);
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = eval('(' + line.slice(6) + ')');
                                    
                                    if (data.error) {
                                        throw new Error(data.message || '服务器错误');
                                    }
                                    
                                    if (data.text) {
                                        assistantMessage.content += data.text;
                                    }
                                    
                                    if (data.thoughts) {
                                        assistantMessage.thoughts += data.thoughts;
                                    }
                                    
                                    if (data.session_id && !this.currentSessionId) {
                                        this.currentSessionId = data.session_id;
                                    }
                                    
                                    this.scrollToBottom();
                                } catch (e) {
                                    console.error('解析数据失败:', e);
                                }
                            }
                        }
                    }
                },
                
                // 普通发送
                async sendNormalMessage(userMessage) {
                    const response = await axios.post(`${this.apiBaseUrl}/api/chat`, {
                        prompt: userMessage,
                        session_id: this.currentSessionId,
                        stream: false,
                        has_thoughts: this.enableThoughts
                    });
                    
                    const data = response.data;
                    
                    if (!this.currentSessionId) {
                        this.currentSessionId = data.session_id;
                    }
                    
                    this.messages.push({
                        role: 'assistant',
                        content: data.text,
                        thoughts: data.thoughts || ''
                    });
                    
                    this.scrollToBottom();
                },
                
                // 删除会话
                async deleteSession(sessionId) {
                    if (!confirm('确定要删除这个会话吗？')) return;
                    
                    try {
                        await axios.delete(`${this.apiBaseUrl}/api/sessions/${sessionId}`);
                        await this.loadSessions();
                        
                        if (this.currentSessionId === sessionId) {
                            this.newChat();
                        }
                    } catch (error) {
                        console.error('删除会话失败:', error);
                        this.errorMessage = '删除失败';
                    }
                },
                
                // 格式化消息（支持Markdown）
                formatMessage(text) {
                    if (!text) return '';
                    // 使用marked库渲染Markdown
                    if (typeof marked !== 'undefined') {
                        return marked.parse(text);
                    }
                    // 简单换行处理
                    return text.replace(/\n/g, '<br>');
                },
                
                // 格式化日期
                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const date = new Date(dateStr);
                    const now = new Date();
                    const diff = now - date;
                    
                    if (diff < 60000) return '刚刚';
                    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
                    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
                    if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
                    
                    return date.toLocaleDateString('zh-CN');
                },
                
                // 滚动到底部
                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$refs.messagesContainer;
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    });
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
